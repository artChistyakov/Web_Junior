<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Image Gallery!</title>
  
  <!-- Підключаємо СПОЧАТКУ саму бібліотеку jQuery лише потім наш скрипт -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  
  <!-- Підключаємо стилі галереї -->
  <link rel="stylesheet" type="text/css" href="style.css">
  
  <!-- Підключаємо наш файл зі скриптами. 
       Слово 'defer' гарантує, що скрипт почне працювати ТІЛЬКИ ПІСЛЯ того, як завантажиться весь HTML -->
  <script src="js.js" defer></script>
</head>

<body>

  <!-- ========================================== -->
  <!-- БЛОК 1: ОВЕРЛЕЙ (СПЛИВАЮЧЕ ТЕМНЕ ВІКНО)      -->
  <!-- ========================================== -->
  <!-- Цей блок спочатку буде прихований через CSS. Ми покажемо його через jQuery при кліку на фото -->
  <div class="overlay">
    <div class="overlay-inner">
      
      <!-- ЧОМУ МИ ЦЕ ЗАКОМЕНТУВАЛИ:
           Ця кнопка "Close" (Хрестик) нам не потрібна. На сучасних сайтах і особливо з телефонів 
           тягнутися до маленького хрестика незручно. 
           Замість цього, в нашому js-файлі ми зробимо так, щоб клік по порожньому темному фону 
           автоматично закривав картинку. Це набагато зручніше для користувача (кращий UX)! -->
      <!-- <button class="close">× Close</button> -->
      
      <!-- Це порожня рамка для великого фото. 
           Сюди jQuery буде динамічно підставляти адресу тієї картинки, на яку клікнув користувач -->
      <img>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- БЛОК 2: САМА ГАЛЕРЕЯ (СІТКА МІНІАТЮР)        -->
  <!-- ========================================== -->
  <section class="gallery">
    
    <!-- ❌ НА ЦЕЙ ШМАТОК НЕ ЗВЕРТАЄМО УВАГИ! ❌ -->
    <!-- Раніше тут була складна ідея: зробити так, щоб поверх картинки при наведенні з'являлася кнопка "View".
         Ми від цього відмовилися, бо це зайве ускладнення коду. Сучасний користувач і так розуміє, 
         що натискати треба прямо на саму мініатюру. Тому ми це закоментували. -->
    <!-- <div class="item">
      <img src="Images/1.jpg">
      <div class="item__overlay">
        <button>View →</button>
      </div>
    </div> -->


    <!-- ✅ А ОСЬ ТАК ВИГЛЯДАЄ РЕАЛЬНА СТРУКТУРА НАШИХ ФОТО ✅ -->
    
    <!-- Обгортка div class="item" потрібна виключно для CSS, щоб красиво вишикувати картинки в сітку. -->
    <div class="item">
      <!-- А це сама мініатюра. Саме її буде "слухати" наш jQuery, очікуючи на клік -->
      <img src="Images/1.jpg">
    </div>
    
    <div class="item">
      <img src="Images/2.jpg">
    </div>
    
    <div class="item">
      <img src="Images/3.jpg">
    </div>
    
    <!-- Всі інші блоки абсолютно ідентичні, міняється лише номер картинки (адреса файлу). -->
    <div class="item">
      <img src="Images/4.jpg">
    </div>
    <div class="item">
      <img src="Images/5.jpg">
    </div>
    <div class="item">
      <img src="Images/6.jpg">
    </div>
    <div class="item">
      <img src="Images/7.jpg">
    </div>
    <div class="item">
      <img src="Images/8.jpg">
    </div>
    <div class="item">
      <img src="Images/9.jpg">
    </div>
    <div class="item">
      <img src="Images/10.jpg">
    </div>
    <div class="item">
      <img src="Images/11.jpg">
    </div>
    <div class="item">
      <img src="Images/12.jpg">
    </div>

  </section>
</body>
</html>
